<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            color: #1e293b;
            background: #f1f5f9;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 18px 6%;
            background: #1e3a8a;
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.25s ease;
        }

        header a:hover {
            background: #1d4ed8;
        }

        header a:focus-visible {
            outline: 2px solid white;
            outline-offset: 3px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 15px;
        }

        .main-card {
            width: min(100%, 760px);
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 25px;
            background: white;
            border: 1px solid #dbe4ef;
            border-radius: 14px;
            box-shadow: 0 8px 24px #00000012;
        }

        .card-content {
            flex: 1;
            min-width: 0;
        }

        .card-image {
            width: 180px;
            height: 180px;
            flex-shrink: 0;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
        }

        .card-content h2 {
            margin-top: 0;
            color: #1d4ed8;
        }

        .card-content p {
            line-height: 1.6;
            color: #475569;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font: inherit;
        }

        textarea {
            min-height: 85px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: 3px solid #bfdbfe;
            border-color: #2563eb;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            padding: 11px 17px;
            border: 1px solid transparent;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.25s ease,
                        transform 0.25s ease;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.97);
        }

        button:focus-visible {
            outline: 3px solid #f59e0b;
            outline-offset: 3px;
        }

        .reset-button {
            background: white;
            color: #334155;
            border-color: #cbd5e1;
        }

        .reset-button:hover {
            background: #e2e8f0;
        }

        footer {
            padding: 18px;
            text-align: center;
            background: #0f172a;
            color: white;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 650px) {
            .main-card {
                flex-direction: column;
                align-items: stretch;
                padding: 18px;
            }

            .card-image {
                width: 100%;
                height: 200px;
            }

            header {
                justify-content: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>My Mini UI</h1>
        <nav aria-label="Main navigation">
            <a href="#home">Home</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main id="home">
        <section class="main-card">
            <div class="card-content">
                <h2>Contact Us</h2>
                <p>
                    Have a question or suggestion? Fill out the form below
                    and share your message with us.
                </p>

                <form action="#" method="get" id="contact">
                    <div>
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name"
                               placeholder="Enter your name" required>
                    </div>

                    <div>
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email"
                               placeholder="you@example.com" required>
                    </div>

                    <div>
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message"
                                  placeholder="Write your message..."
                                  required></textarea>
                    </div>

                    <div class="button-row">
                        <button type="submit">Send Message</button>
                        <button type="reset" class="reset-button">
                            Clear Form
                        </button>
                    </div>
                </form>
            </div>

            <img
                class="card-image"
                src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=500&q=80"
                alt="A modern and bright office workspace">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mini UI Layout. All rights reserved.</p>
    </footer>
</body>
</html>
