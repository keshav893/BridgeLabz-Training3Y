<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            padding: 25px 15px;
            text-align: center;
            background: #0f172a;
            color: white;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        figure {
            margin: 0;
            padding: 10px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 16px #00000018;
            overflow: hidden;
        }

        .image-box {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }

        .image-box img {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background: #00000000;
            transition: background 0.3s ease;
        }

        figure:hover img {
            transform: scale(1.1);
        }

        figure:hover .image-box::after {
            background: #00000045;
        }

        figcaption {
            padding: 12px 5px 5px;
            text-align: center;
            font-weight: bold;
        }

        footer {
            padding: 15px;
            text-align: center;
            background: #e2e8f0;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .image-box img {
                height: 240px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Image Showcase</h1>
        <p>A collection of beautiful places</p>
    </header>

    <main class="gallery">
        <figure>
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Mountain lake">
            </div>
            <figcaption>Mountain Lake</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Green landscape">
            </div>
            <figcaption>Green Landscape</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=800&q=80" alt="Ocean waves">
            </div>
            <figcaption>Ocean Waves</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Mountain village">
            </div>
            <figcaption>Mountain Village</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Sunlight through a forest">
            </div>
            <figcaption>Forest Trail</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Snow-covered mountains">
            </div>
            <figcaption>Snowy Mountains</figcaption>
        </figure>
    </main>

    <footer>
        <p>Explore the beauty of nature.</p>
    </footer>
</body>
</html>
