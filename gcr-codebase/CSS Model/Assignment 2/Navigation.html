
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        h1 {
            text-align: center;
            margin: 40px 10px;
        }

        .navbar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            background: #1e293b;
            padding: 15px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border: 1px solid #64748b;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .navbar a:hover {
            background: lightblue;
            color: #1e293b;
            border-color: #38bdf8;
        }

        .navbar .active {
            background: #2563eb;
            border-color: #2563eb;
            text-decoration: underline;
        }

        main {
            min-height: 60vh;
            padding: 20px;
            text-align: center;
        }

        footer {
            padding: 20px;
            background: #1e293b;
            color: white;
            text-align: center;
        }

        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
            }

            .navbar a {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <h1>My Website</h1>

    <nav class="navbar">
        <a href="#home" class="active">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#contact">Contact</a>
    </nav>

    <main id="home">
        <h2>Welcome to My Website</h2>
        <p>Move your mouse over the navigation links to see the effects.</p>
    </main>

    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
