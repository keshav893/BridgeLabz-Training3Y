
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .box {
            padding: 20px;
            background: white;
            border: 4px solid blue;
            transition: border-color 0.3s;
        }

        .dashed {
            border-style: dashed;
            padding: 15px;
        }

        .double {
            border-style: double;
            border-width: 6px;
            padding: 25px;
        }

        .groove {
            border-style: groove;
            border-radius: 20px;
        }

        .rounded {
            border-radius: 30px;
        }

        .box:hover {
            border-color: red;
        }
    </style>
</head>
<body>

    <h1>Borders and Padding</h1>

    <div class="container">
        <div class="box">Solid Border</div>
        <div class="box dashed">Dashed Border</div>
        <div class="box double">Double Border</div>
        <div class="box groove">Groove Border</div>
        <div class="box rounded">Rounded Corners</div>
    </div>

</body>
</html>
