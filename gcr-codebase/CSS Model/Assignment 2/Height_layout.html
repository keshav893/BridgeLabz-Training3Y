
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            text-align: center;
            padding: 20px;
        }

        .container {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            overflow: auto;
            border-radius: 10px;
        }

        .box1 {
            width: 150px;
            height: 120px;
            background: lightblue;
        }

        .box2 {
            width: 30%;
            min-width: 150px;
            max-width: 250px;
            height: 180px;
            background: lightgreen;
        }

        .box3 {
            width: 12em;
            height: 15vh;
            min-height: 100px;
            background: lightcoral;
        }
    </style>
</head>
<body>

    <h1>Height and Width Practice</h1>

    <div class="container">
        <div class="box box1">150px × 120px</div>
        <div class="box box2">Width: 30%</div>
        <div class="box box3">Width: 12em</div>
    </div>

</body>
</html>
