<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            padding: 25px 15px;
            text-align: center;
            background: #172554;
            color: white;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 22px;
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        figure {
            margin: 0;
            overflow: hidden;
            border-radius: 12px;
            background: white;
            box-shadow: 0 5px 15px #00000015;
        }

        figure img {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        .blur img {
            filter: blur(2px);
        }

        .grayscale img {
            filter: grayscale(100%);
        }

        .sepia img {
            filter: sepia(100%);
        }

        .brightness img {
            filter: brightness(60%);
        }

        .contrast img {
            filter: contrast(40%);
        }

        .hue img {
            filter: hue-rotate(120deg);
        }

        figure:hover img {
            filter: none;
            transform: scale(1.04);
        }

        figcaption {
            padding: 14px;
            text-align: center;
            font-weight: bold;
        }

        footer {
            padding: 15px;
            text-align: center;
            background: #e2e8f0;
        }

        @media (max-width: 599px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Hover over an image to remove its filter.</p>
    </header>

    <main class="gallery">
        <figure class="blur">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"
                 alt="Natural landscape">
            <figcaption>Blur Filter</figcaption>
        </figure>

        <figure class="grayscale">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80"
                 alt="Mountain landscape">
            <figcaption>Grayscale Filter</figcaption>
        </figure>

        <figure class="sepia">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                 alt="Green forest">
            <figcaption>Sepia Filter</figcaption>
        </figure>

        <figure class="brightness">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80"
                 alt="Lake between mountains">
            <figcaption>Brightness Filter</figcaption>
        </figure>

        <figure class="contrast">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80"
                 alt="Snowy mountain peaks">
            <figcaption>Contrast Filter</figcaption>
        </figure>

        <figure class="hue">
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=800&q=80"
                 alt="Ocean waves">
            <figcaption>Hue-Rotate Filter</figcaption>
        </figure>
    </main>

    <footer>
        <p>CSS Filters and Responsive Grid Practice</p>
    </footer>
</body>
</html>
