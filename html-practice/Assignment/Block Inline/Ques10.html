Ques 10. Create a Dropdown-based Selection Page:
● Add multiple <select> dropdowns for:
○ Country
○ State
○ City

○ Favorite Tourist Place
● Each dropdown must have a pre-selected option.
● Add a <p> summarizing your choices.



Ans 10. 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Selection</title>
</head>

<body>

<h1>Choose Your Travel Destination</h1>

<label for="country">Country:</label>

<select id="country">
    <option selected>India</option>
    <option>United States</option>
    <option>France</option>
    <option>Australia</option>
</select>

<br><br>

<label for="state">State:</label>

<select id="state">
    <option selected>Uttar Pradesh</option>
    <option>Rajasthan</option>
    <option>Maharashtra</option>
    <option>Goa</option>
</select>

<br><br>

<label for="city">City:</label>

<select id="city">
    <option selected>Mathura</option>
    <option>Agra</option>
    <option>Jaipur</option>
    <option>Mumbai</option>
</select>

<br><br>

<label for="touristPlace">Favorite Tourist Place:</label>

<select id="touristPlace">
    <option selected>Taj Mahal</option>
    <option>Vrindavan</option>
    <option>Gateway of India</option>
    <option>Amer Fort</option>
</select>

<p>
    My selected destination is Mathura, Uttar Pradesh, India,
    and my favorite tourist place is the Taj Mahal.
</p>

</body>
</html>
